[package]
name = "usbip-macos"
version = "0.0.1"
edition = "2021"

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["full"] }
clap = "4"
clap-num = "1"
anyhow = "1"
thiserror = "2"
log = { version = "0.4", features = ["max_level_trace", "release_max_level_debug"] }
simple_logger = { version = "5.2", default-features = false, features = ["stderr", "colors", "timestamps"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["relax-sign-encoding"] } # https://github.com/madsmtm/objc2/issues/754
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-io-usb-host = "0.3"

[dev-dependencies]
proptest = "1"
nusb = "0.2"
